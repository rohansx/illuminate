[package]
name = "illuminate-trail"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Session capture for illuminate — Claude Code, Cursor, and Codex prompt-trail ingestion"

[dependencies]
illuminate = { version = "0.31.0", path = "../illuminate-core" , default-features = false }
chrono = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
uuid = { workspace = true }
notify = "7"
glob = "0.3"

[features]
# Forwards the local-ONNX extraction stack. On by default;
# `--no-default-features` yields a build that needs no network at build time.
default = ["onnx"]
onnx = ["illuminate/extract"]
test-helpers = []

[dev-dependencies]
illuminate-trail = { path = ".", features = ["test-helpers"], default-features = false }
tempfile = "3"
