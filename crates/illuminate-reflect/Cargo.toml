[package]
name = "illuminate-reflect"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Reflexion loop for illuminate — capture agent failures as lessons"

[dependencies]
illuminate = { version = "0.31.0", path = "../illuminate-core" , default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }

[features]
# Forwards the local-ONNX extraction stack. On by default;
# `--no-default-features` yields a build that needs no network at build time.
default = ["onnx"]
onnx = ["illuminate/extract"]
